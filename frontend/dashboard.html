<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudySync — Panel Principal</title>
  <meta name="description" content="Dashboard general de StudySync con métricas académicas, tareas próximas y asignaturas.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="toast-container" class="toast-container"></div>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-logo">
       
        <span class="logo-text">StudySync</span>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-link active" href="/dashboard">
          <span class="nav-link-icon"></span>
          <span>Dashboard</span>
        </a>
        <a class="nav-link" href="/subjects">
          <span class="nav-link-icon"></span>
          <span>Materias</span>
        </a>
        <a class="nav-link" href="/tasks">
          <span class="nav-link-icon"></span>
          <span>Tareas</span>
        </a>
        <a class="nav-link" href="/groups">
          <span class="nav-link-icon"></span>
          <span>Grupos</span>
        </a>
      </nav>

      <div class="sidebar-user">
        <div class="user-avatar" id="user-avatar">U</div>
        <div class="user-info">
          <span class="user-name" id="user-name">Cargando...</span>
          <span class="user-email" id="user-email">usuario@studysync.edu</span>
        </div>
        <button class="logout-btn" id="logout-btn" title="Cerrar sesión">Salir</button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div style="flex: 1; display: flex; flex-direction: column;">
      <!-- Mobile Bar -->
      <header class="mobile-topbar">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <span style="font-weight: 700; font-size: 1.15rem; color: var(--text-primary);">StudySync</span>
        </div>
        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Abrir menú">
          ☰
        </button>
      </header>

      <main class="main-content">
        <!-- Page Header -->
        <header class="page-header">
          <h2 class="page-title">Resumen Académico</h2>
          <p class="page-subtitle">Seguimiento de materias y próximas entregas.</p>
        </header>

        <!-- 2 Column Widgets -->
        <div class="grid-2">
          <!-- Upcoming Tasks Card -->
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Próximas Entregas</h3>
              <a href="/tasks" class="btn btn-outline btn-sm">Ver todas</a>
            </div>
            <div id="upcoming-tasks">
              <div class="skeleton" style="height: 56px; margin-bottom: 0.5rem;"></div>
              <div class="skeleton" style="height: 56px; margin-bottom: 0.5rem;"></div>
              <div class="skeleton" style="height: 56px;"></div>
            </div>
          </div>

          <!-- Recent Subjects Card -->
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Mis Materias</h3>
              <a href="/subjects" class="btn btn-outline btn-sm">Gestionar</a>
            </div>
            <div id="recent-subjects">
              <div class="skeleton" style="height: 56px; margin-bottom: 0.5rem;"></div>
              <div class="skeleton" style="height: 56px; margin-bottom: 0.5rem;"></div>
              <div class="skeleton" style="height: 56px;"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/dashboard.js?v=2"></script>
</body>
</html>
